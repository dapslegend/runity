[package]
name = "runity"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
hex = "0.4"
num_cpus = "1"
rand = "0.8"
rayon = "1"
regex = "1"
secp256k1 = { version = "0.28", features = ["rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
structopt = "0.3"

[[bin]]
name = "runity"
path = "src/bin/vanity_gen.rs"
